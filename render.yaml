# Cấu hình deploy lên Render (https://render.com) — gói miễn phí.
# Cách dùng: Render Dashboard → New → Blueprint → chọn repo này → Apply.
services:
  - type: web
    name: momo-techday
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Bắt đầu ở chế độ giả lập; khi có khóa MoMo sandbox thì đổi thành "momo"
      - key: PAYMENT_MODE
        value: simulate
      - key: ADMIN_TOKEN
        generateValue: true
      # Khóa MoMo, ví blockchain, API key AI: KHÔNG khai báo ở đây để form tạo Blueprint
      # không bắt nhập. Khi có, thêm trong Render → service → Environment:
      #   MOMO_PARTNER_CODE, MOMO_ACCESS_KEY, MOMO_SECRET_KEY (rồi đổi PAYMENT_MODE=momo)
      #   PRIVATE_KEY, CONTRACT_ADDRESS
      #   LLM_BASE_URL, LLM_API_KEY, LLM_MODEL
